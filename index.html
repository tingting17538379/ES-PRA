<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淡蘭試煉迷宮：結構挑戰</title>
<style>
  :root{
    --bg:#070b1a; --panel:rgba(15,23,48,.72);
    --cyan:#22d3ee; --pink:#f472b6; --lime:#a3e635; --violet:#a78bfa;
    --text:#e2e8f0; --muted:#94a3b8;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
    font-family:'Noto Sans TC','微軟正黑體','Microsoft JhengHei',system-ui,sans-serif;
    color:var(--text); background:var(--bg); overflow-x:hidden; padding:24px; font-weight:500;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(34,211,238,.18), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(244,114,182,.16), transparent 40%),
      linear-gradient(rgba(34,211,238,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,.07) 1px, transparent 1px);
    background-size:auto,auto,40px 40px,40px 40px;
  }
  /* 緩慢移動的掃描線 */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:linear-gradient(transparent 0, rgba(34,211,238,.06) 50%, transparent 100%);
    height:200px; animation:scan 6s linear infinite;
  }
  @keyframes scan{from{transform:translateY(-200px)}to{transform:translateY(100vh)}}

  .container{
    position:relative; width:100%; max-width:960px; padding:48px 40px 40px;
    background:var(--panel); backdrop-filter:blur(8px);
    border:1px solid rgba(34,211,238,.35); border-radius:20px; text-align:center;
    box-shadow:0 0 0 1px rgba(167,139,250,.15), 0 0 40px rgba(34,211,238,.15), inset 0 0 60px rgba(34,211,238,.05);
  }
  /* 四角科技框 */
  .container::before,.container::after{
    content:""; position:absolute; width:28px; height:28px; border:3px solid var(--cyan);
    filter:drop-shadow(0 0 6px var(--cyan));
  }
  .container::before{top:-2px;left:-2px;border-right:none;border-bottom:none;border-top-left-radius:20px}
  .container::after{bottom:-2px;right:-2px;border-left:none;border-top:none;border-bottom-right-radius:20px}

  .tag{
    display:inline-block; font-family:Consolas,'Courier New',monospace; font-size:14px; letter-spacing:3px;
    font-weight:700; color:var(--lime); border:1px solid rgba(163,230,53,.5); padding:4px 14px; border-radius:999px; margin-bottom:18px;
    text-shadow:0 0 8px rgba(163,230,53,.7);
  }
  h1{
    margin:0 0 12px; font-size:38px; font-weight:900; letter-spacing:2px; line-height:1.35;
    background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 12px rgba(34,211,238,.45));
  }
  .subtitle{color:#cbd5e1; font-size:19px; font-weight:700; margin:0 0 36px}
  .subtitle .cursor{color:var(--cyan); animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .activity-list{list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(3,1fr); gap:22px}
  .activity-list li{--c:var(--cyan)}
  .activity-list li:nth-child(2){--c:var(--violet)}
  .activity-list li:nth-child(3){--c:var(--pink)}
  .activity-list a{
    height:100%; display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:22px 16px 20px; text-decoration:none; color:var(--text);
    background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
    border:1px solid color-mix(in srgb,var(--c) 55%,transparent); border-radius:16px;
    box-shadow:0 0 14px color-mix(in srgb,var(--c) 25%,transparent);
    transition:transform .25s, box-shadow .25s, border-color .25s;
  }
  .activity-list a:hover,.activity-list a:focus-visible{
    transform:translateY(-6px); border-color:var(--c); outline:none;
    box-shadow:0 0 28px color-mix(in srgb,var(--c) 60%,transparent), inset 0 0 20px color-mix(in srgb,var(--c) 15%,transparent);
  }
  .level{
    font-family:Consolas,'Courier New',monospace; font-size:14px; font-weight:700; letter-spacing:2px; color:var(--c);
    text-shadow:0 0 8px var(--c);
  }
  .name{font-size:26px; font-weight:900; color:#fff}
  .page{font-size:15px; font-weight:700; color:#cbd5e1}
  .chart{
    width:100%; height:130px; display:flex; align-items:center; justify-content:center;
    background:rgba(7,11,26,.72); border-radius:10px; padding:10px;
    box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 60%,transparent), inset 0 0 18px color-mix(in srgb,var(--c) 12%,transparent);
  }
  .chart img{max-height:100%; max-width:100%; object-fit:contain}
  .go{
    margin-top:auto; font-size:16px; font-weight:900; padding:8px 22px; border-radius:999px;
    color:var(--bg); background:var(--c); box-shadow:0 0 14px var(--c);
  }

  @media (max-width:820px){
    .activity-list{grid-template-columns:1fr; max-width:420px; margin:0 auto}
    h1{font-size:30px}
  }
  @media (max-width:520px){
    .container{padding:36px 18px 24px}
    h1{font-size:25px}
    .subtitle{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    body::after,.subtitle .cursor{animation:none}
    .activity-list a{transition:none}
  }
</style>
</head>
<body>
  <main class="container">
    <div class="tag">&gt; SYSTEM ONLINE_</div>
    <h1>淡蘭試煉迷宮<br>程式設計結構挑戰</h1>
    <p class="subtitle">歡迎進入淡蘭試煉迷宮！請選擇您想要挑戰的關卡<span class="cursor">▌</span></p>

    <ul class="activity-list">
      <li>
        <a href="P01.html">
          <span class="level">LEVEL 01</span>
          <span class="name">循序結構</span>
          <span class="chart"><img src="./data/IL.png" alt="循序結構流程圖"></span>
          <span class="page">配合課本 P.93 做一做</span>
          <span class="go">開始挑戰 ▶</span>
        </a>
      </li>
      <li>
        <a href="P02.html">
          <span class="level">LEVEL 02</span>
          <span class="name">重複結構</span>
          <span class="chart"><img src="./data/IM.png" alt="重複結構流程圖"></span>
          <span class="page">配合課本 P.96 做一做</span>
          <span class="go">開始挑戰 ▶</span>
        </a>
      </li>
      <li>
        <a href="P03.html">
          <span class="level">LEVEL 03</span>
          <span class="name">選擇結構</span>
          <span class="chart"><img src="./data/IR.png" alt="選擇結構流程圖"></span>
          <span class="page">配合課本 P.99 做一做</span>
          <span class="go">開始挑戰 ▶</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
