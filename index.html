<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淡蘭試煉迷宮：結構挑戰</title>
<style>
  /* Cover — 3D clay (plasticine) style, matches P02 clay.css */
  :root{
    --ink:#123a5e; --muted:#2c5578;
    --c1:#1f6fd1; --c1d:#154f99; --c1l:#d9ecfb;
    --c2:#e08a12; --c2d:#a35c00; --c2l:#fdeccf;
    --c3:#e0566f; --c3d:#a8324a; --c3l:#fde0e5;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
    font-family:'Noto Sans TC','微軟正黑體','Microsoft JhengHei',system-ui,sans-serif;
    color:var(--ink); overflow-x:hidden; padding:24px; font-weight:500;
    background-color:#b5def3;
    background-image:
      radial-gradient(ellipse 55% 40% at 50% 38%, rgba(255,255,255,.45), transparent 70%),
      linear-gradient(180deg,#9fd3ef 0%,#b8e0f4 55%,#cbe8f7 100%);
    background-attachment:fixed;
  }
  .container{
    position:relative; width:100%; max-width:1000px; padding:20px 20px 30px;
    background:none; border:none; border-radius:0; box-shadow:none; text-align:center;
  }
  /* hero: title only; decorations live in the fixed .bg-deco layer behind everything */
  .hero{position:relative; padding:20px 0 10px; margin-bottom:26px}
  .hero-text{position:relative; max-width:560px; margin:0 auto}
  .container{z-index:1}

  /* scattered clay objects around the whole viewport, some bleeding off the edges */
  .bg-deco{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0}
  .bg-deco > *{position:absolute; display:block; transform:rotate(var(--r,0deg))}
  .bg-deco img{filter:drop-shadow(0 14px 12px rgba(18,58,94,.22))}
  .o-robot{left:-34px; top:2vh; height:min(46vh,360px); --r:-13deg; animation:bob 3s ease-in-out infinite}
  .o-flower{right:3vw; top:-3vh; height:min(50vh,390px); --r:-13deg; transform-origin:50% 100%; animation:sway 3.8s ease-in-out infinite}
  .o-card-l{left:-46px; bottom:-56px; width:min(17vw,230px); --r:-21deg}
  .o-card-r{right:5vw; bottom:-44px; width:min(12vw,165px); --r:14deg}
  .o-card-a{right:27vw; top:-38px; width:min(7vw,96px); --r:28deg; opacity:.95}
  .o-bloom{left:23vw; top:4vh; height:min(15vh,118px); --r:-24deg; animation:sway 4.6s ease-in-out infinite reverse}
  .spark{width:var(--s,22px); height:var(--s,22px);
    background:radial-gradient(circle at 35% 30%, #fff6c8 0 18%, #ffd84d 45%, #f0a43a 100%);
    clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
    filter:drop-shadow(0 3px 2px rgba(160,90,0,.35)); animation:twinkle 2.4s ease-in-out infinite}
  .spark.s1{left:15vw; top:40vh; --s:34px; --r:12deg}
  .spark.s2{right:11vw; top:39vh; --s:26px; --r:-8deg; animation-delay:.6s}
  .spark.s3{left:31vw; top:6vh; --s:22px; --r:20deg; animation-delay:1.1s}
  .spark.s4{right:28vw; bottom:3vh; --s:30px; animation-delay:1.7s}
  .spark.s5{left:3vw; bottom:30vh; --s:18px; animation-delay:.3s}
  @keyframes bob{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(calc(var(--r) + 3deg)) translateY(-10px)}}
  @keyframes sway{0%,100%{transform:rotate(var(--r))}50%{transform:rotate(calc(var(--r) - 5deg))}}
  @keyframes twinkle{0%,100%{opacity:1; scale:1}50%{opacity:.55; scale:.75}}

  .tag{
    display:inline-block; font-family:Consolas,'Courier New',monospace; font-size:15px; letter-spacing:3px;
    font-weight:700; color:#fff; background:var(--c1); border:none;
    padding:7px 18px; border-radius:999px; margin-bottom:16px;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.18), 0 4px 0 var(--c1d);
  }
  h1{ margin:0 0 12px; font-size:42px; font-weight:900; letter-spacing:2px; line-height:1.3; color:var(--ink);
    text-shadow:0 3px 0 #fff, 0 5px 0 rgba(63,159,210,.25); }
  .subtitle{color:var(--ink); font-size:19px; font-weight:700; margin:0}
  .subtitle .cursor{color:var(--c1); animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* level cards: puffy clay slabs */
  .activity-list{list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(3,1fr); gap:26px}
  .activity-list li{--c:var(--c1); --cd:var(--c1d); --cl:var(--c1l)}
  .activity-list li:nth-child(2){--c:var(--c2); --cd:var(--c2d); --cl:var(--c2l)}
  .activity-list li:nth-child(3){--c:var(--c3); --cd:var(--c3d); --cl:var(--c3l)}
  .activity-list a{
    height:100%; display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:18px 16px 22px; text-decoration:none; color:var(--ink);
    background:var(--cl); border:none; border-radius:28px;
    box-shadow:
      inset 0 5px 0 rgba(255,255,255,.85),
      inset 0 -7px 0 color-mix(in srgb,var(--c) 30%,transparent),
      0 8px 0 color-mix(in srgb,var(--c) 55%,#fff),
      0 16px 22px rgba(18,58,94,.16);
    transition:transform .2s, box-shadow .2s;
  }
  .activity-list a:hover,.activity-list a:focus-visible{
    transform:translateY(-5px); outline:none;
    box-shadow:
      inset 0 5px 0 rgba(255,255,255,.85),
      inset 0 -7px 0 color-mix(in srgb,var(--c) 30%,transparent),
      0 13px 0 color-mix(in srgb,var(--c) 55%,#fff),
      0 22px 26px rgba(18,58,94,.2);
  }
  .activity-list a:focus-visible{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--c1),0 13px 0 color-mix(in srgb,var(--c) 55%,#fff)}
  .level{
    font-family:Consolas,'Courier New',monospace; font-size:14px; font-weight:700; letter-spacing:2px; color:#fff;
    background:var(--c); padding:5px 14px; border-radius:999px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.18), 0 3px 0 var(--cd);
  }
  .name{font-size:28px; font-weight:900; color:var(--ink)}
  .page{font-size:16px; font-weight:700; color:var(--muted)}
  .chart{
    width:100%; height:150px; display:flex; align-items:center; justify-content:center;
    background:#fffdf7; border-radius:20px; padding:12px; border:none;
    box-shadow:inset 0 5px 10px color-mix(in srgb,var(--c) 30%,transparent), inset 0 -3px 0 #fff, 0 3px 0 rgba(255,255,255,.8);
  }
  .chart img{max-height:100%; max-width:100%; object-fit:contain}
  .go{
    margin-top:auto; font-size:17px; font-weight:900; padding:10px 28px; border-radius:999px;
    color:#fff; background:var(--c); border:none;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.38), inset 0 -5px 0 rgba(0,0,0,.18), 0 5px 0 var(--cd), 0 9px 10px rgba(18,58,94,.18);
    transition:transform .15s, box-shadow .15s;
  }
  .activity-list a:hover .go{transform:translateY(-1px)}
  .activity-list a:active .go{transform:translateY(4px); box-shadow:inset 0 3px 0 rgba(255,255,255,.38), inset 0 -3px 0 rgba(0,0,0,.18), 0 1px 0 var(--cd)}

  @media (max-width:820px){
    .activity-list{grid-template-columns:1fr; max-width:420px; margin:0 auto}
    h1{font-size:30px}
  }
  @media (max-width:520px){
    body{padding:14px}
    .container{padding:8px 4px 20px}
    .hero{padding:96px 0 6px; margin-bottom:18px}
    .o-robot{left:-22px; top:-6px; height:150px; --r:-12deg}
    .o-flower{right:2px; top:-14px; height:160px; --r:-12deg}
    .o-bloom{left:27vw; top:4px; height:60px}
    .o-card-a{right:25vw; top:-26px; width:56px}
    .o-card-l{left:-40px; bottom:-40px; width:120px}
    .o-card-r{right:-30px; bottom:-34px; width:104px}
    .spark.s1,.spark.s2,.spark.s5{display:none}
    .spark.s3{left:28vw; top:62px; --s:20px}
    .spark.s4{right:22vw; top:70px; bottom:auto; --s:18px}
    h1{font-size:25px}
    .subtitle{font-size:14px}
    .tag{font-size:13px; padding:6px 14px; margin-bottom:12px}
  }
  @media (prefers-reduced-motion:reduce){
    .subtitle .cursor,.bg-deco > *{animation:none}
    .activity-list a,.go{transition:none}
  }
</style>
</head>
