<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淡蘭試煉迷宮：結構挑戰</title>
<style>
  :root{
    --bg:#eaf6ff; --panel:rgba(255,255,255,.86);
    --cyan:#0284c7; --pink:#db2777; --lime:#16a34a; --violet:#7c3aed;
    --text:#0f2a4a; --muted:#36506e;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
    font-family:'Noto Sans TC','微軟正黑體','Microsoft JhengHei',system-ui,sans-serif;
    color:var(--text); overflow-x:hidden; padding:24px; font-weight:500;
    background-image:
      radial-gradient(ellipse 36% 15% at 12% 12%, rgba(255,255,255,.95), transparent 70%),
      radial-gradient(ellipse 30% 12% at 86% 20%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(ellipse 40% 16% at 72% 94%, rgba(255,255,255,.9), transparent 70%),
      linear-gradient(rgba(2,132,199,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(2,132,199,.06) 1px, transparent 1px),
      linear-gradient(180deg,#d6edff 0%,#eef8ff 55%,#ffffff 100%);
    background-size:auto,auto,auto,40px 40px,40px 40px,auto;
    background-attachment:fixed;
  }

  .container{
    position:relative; width:100%; max-width:960px; padding:48px 40px 40px;
    background:var(--panel); backdrop-filter:blur(10px);
    border:1px solid #cfe7f8; border-radius:24px; text-align:center;
    box-shadow:0 20px 50px rgba(30,100,170,.14), 0 2px 6px rgba(30,100,170,.06);
  }

  .tag{
    display:inline-block; font-family:Consolas,'Courier New',monospace; font-size:14px; letter-spacing:3px;
    font-weight:700; color:#fff; background:linear-gradient(135deg,#38bdf8,#0284c7);
    padding:5px 16px; border-radius:999px; margin-bottom:18px;
    box-shadow:0 4px 12px rgba(2,132,199,.25);
  }
  h1{
    margin:0 0 12px; font-size:38px; font-weight:900; letter-spacing:2px; line-height:1.35;
    background:linear-gradient(90deg,#0369a1,#0284c7 50%,#2563eb);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{color:var(--muted); font-size:19px; font-weight:700; margin:0 0 36px}
  .subtitle .cursor{color:var(--cyan); animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .activity-list{list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(3,1fr); gap:22px}
  .activity-list li{--c:var(--cyan); --g1:#38bdf8}
  .activity-list li:nth-child(2){--c:var(--violet); --g1:#a78bfa}
  .activity-list li:nth-child(3){--c:var(--pink); --g1:#f472b6}
  .activity-list a{
    height:100%; display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:22px 16px 20px; text-decoration:none; color:var(--text);
    background:linear-gradient(180deg,#ffffff,color-mix(in srgb,var(--c) 5%,#fff));
    border:2px solid color-mix(in srgb,var(--c) 35%,#fff); border-top:5px solid var(--c); border-radius:18px;
    box-shadow:0 8px 22px rgba(30,100,170,.10);
    transition:transform .25s, box-shadow .25s, border-color .25s;
  }
  .activity-list a:hover,.activity-list a:focus-visible{
    transform:translateY(-6px); border-color:var(--c); outline:none;
    box-shadow:0 16px 30px color-mix(in srgb,var(--c) 22%,transparent);
  }
  .level{
    font-family:Consolas,'Courier New',monospace; font-size:14px; font-weight:700; letter-spacing:2px; color:var(--c);
  }
  .name{font-size:26px; font-weight:900; color:var(--text)}
  .page{font-size:15px; font-weight:700; color:var(--muted)}
  .chart{
    width:100%; height:130px; display:flex; align-items:center; justify-content:center;
    background:#fff; border-radius:12px; padding:10px;
    border:1.5px solid color-mix(in srgb,var(--c) 30%,#fff);
    background-image:linear-gradient(color-mix(in srgb,var(--c) 6%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--c) 6%,transparent) 1px,transparent 1px);
    background-size:12px 12px;
  }
  .chart img{max-height:100%; max-width:100%; object-fit:contain}
  .go{
    margin-top:auto; font-size:16px; font-weight:900; padding:9px 24px; border-radius:999px;
    color:#fff; background:linear-gradient(135deg,var(--g1),var(--c));
    box-shadow:0 6px 14px color-mix(in srgb,var(--c) 30%,transparent);
  }

  @media (max-width:820px){
    .activity-list{grid-template-columns:1fr; max-width:420px; margin:0 auto}
    h1{font-size:30px}
  }
  @media (max-width:520px){
    .container{padding:36px 18px 24px}
    h1{font-size:25px}
    .subtitle{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    .subtitle .cursor{animation:none}
    .activity-list a{transition:none}
  }
</style>
</head>
