<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淡蘭試煉迷宮：結構挑戰</title>
<style>
  :root{
    --cyan:#0369a1; --pink:#be185d; --lime:#15803d; --violet:#6d28d9;
    --text:#0b2545; --muted:#1f3b5c; --edge:#2f6ea8;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
    font-family:'Noto Sans TC','微軟正黑體','Microsoft JhengHei',system-ui,sans-serif;
    color:var(--text); overflow-x:hidden; padding:24px; font-weight:500;
    background-color:#c3dcef;
    background-image:
      radial-gradient(ellipse 36% 14% at 12% 12%, rgba(232,242,250,.75), transparent 70%),
      radial-gradient(ellipse 30% 12% at 86% 20%, rgba(232,242,250,.65), transparent 70%),
      linear-gradient(rgba(11,37,69,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(11,37,69,.07) 1px, transparent 1px),
      linear-gradient(180deg,#a9cbe6 0%,#c3dcef 55%,#d3e6f4 100%);
    background-size:auto,auto,40px 40px,40px 40px,auto;
    background-attachment:fixed;
  }
  .container{
    position:relative; width:100%; max-width:980px; padding:44px 40px 40px;
    background:#e6f0f8; border:4px solid var(--edge); border-radius:24px; text-align:center;
    box-shadow:0 8px 0 rgba(11,37,69,.18);
  }
  .tag{
    display:inline-block; font-family:Consolas,'Courier New',monospace; font-size:15px; letter-spacing:3px;
    font-weight:700; color:#fff; background:#0a58a6; border:2px solid #0b2545;
    padding:5px 16px; border-radius:999px; margin-bottom:18px;
  }
  h1{ margin:0 0 12px; font-size:40px; font-weight:900; letter-spacing:2px; line-height:1.35; color:#0b2545; }
  .subtitle{color:var(--text); font-size:20px; font-weight:700; margin:0 0 34px}
  .subtitle .cursor{color:#0a58a6; animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .activity-list{list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(3,1fr); gap:22px}
  .activity-list li{--c:var(--cyan); --g1:#0a7bc4}
  .activity-list li:nth-child(2){--c:var(--violet); --g1:#7c3aed}
  .activity-list li:nth-child(3){--c:var(--pink); --g1:#db2777}
  .activity-list a{
    height:100%; display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:20px 16px 20px; text-decoration:none; color:var(--text);
    background:color-mix(in srgb,var(--c) 10%,#dbe8f3);
    border:3px solid var(--c); border-top-width:8px; border-radius:18px;
    box-shadow:0 5px 0 color-mix(in srgb,var(--c) 45%,#0b2545);
    transition:transform .2s, box-shadow .2s;
  }
  .activity-list a:hover,.activity-list a:focus-visible{
    transform:translateY(-4px); outline:3px solid #0b2545; outline-offset:2px;
    box-shadow:0 9px 0 color-mix(in srgb,var(--c) 45%,#0b2545);
  }
  .level{ font-family:Consolas,'Courier New',monospace; font-size:16px; font-weight:700; letter-spacing:2px; color:var(--c); }
  .name{font-size:28px; font-weight:900; color:var(--text)}
  .page{font-size:16px; font-weight:700; color:var(--text)}
  .chart{
    width:100%; height:150px; display:flex; align-items:center; justify-content:center;
    background:#eef4fa; border-radius:12px; padding:10px;
    border:3px solid color-mix(in srgb,var(--c) 70%,#0b2545);
    background-image:linear-gradient(rgba(11,37,69,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(11,37,69,.07) 1px,transparent 1px);
    background-size:12px 12px;
  }
  .chart img{max-height:100%; max-width:100%; object-fit:contain}
  .go{
    margin-top:auto; font-size:17px; font-weight:900; padding:9px 26px; border-radius:999px;
    color:#fff; background:linear-gradient(180deg,var(--g1),var(--c)); border:3px solid #0b2545;
    box-shadow:0 4px 0 #0b2545;
  }
  @media (max-width:820px){
    .activity-list{grid-template-columns:1fr; max-width:420px; margin:0 auto}
    h1{font-size:30px}
  }
  @media (max-width:520px){
    .container{padding:32px 16px 22px}
    h1{font-size:25px}
    .subtitle{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    .subtitle .cursor{animation:none}
    .activity-list a{transition:none}
  }
</style>
</head>
