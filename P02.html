    <style>
        :root {
            --bg: #070b1a;
            --panel: rgba(15,23,48,.72);
            --cyan: #22d3ee;
            --pink: #f472b6;
            --lime: #a3e635;
            --violet: #a78bfa;
            --text: #e2e8f0;
            --muted: #cbd5e1;
            --accent: #a78bfa;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: 'Noto Sans TC', '微軟正黑體', 'Microsoft JhengHei', system-ui, sans-serif;
            font-weight: 500;
            color: var(--text);
            background: var(--bg);
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(167,139,250,.20), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(34,211,238,.14), transparent 40%),
                linear-gradient(rgba(34,211,238,.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34,211,238,.07) 1px, transparent 1px);
            background-size: auto, auto, 40px 40px, 40px 40px;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            background: linear-gradient(transparent 0, rgba(34,211,238,.06) 50%, transparent 100%);
            height: 200px;
            animation: scan 6s linear infinite;
        }
        @keyframes scan {
            from { transform: translateY(-200px); }
            to { transform: translateY(100vh); }
        }

        .game-container {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
            padding: 36px 36px 32px;
            background: var(--panel);
            backdrop-filter: blur(8px);
            border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
            border-radius: 20px;
            box-shadow:
                0 0 0 1px rgba(167,139,250,.15),
                0 0 40px color-mix(in srgb, var(--accent) 22%, transparent),
                inset 0 0 60px rgba(34,211,238,.05);
        }
        .game-container::before,
        .game-container::after {
            content: "";
            position: absolute;
            width: 28px;
            height: 28px;
            border: 3px solid var(--accent);
            filter: drop-shadow(0 0 6px var(--accent));
            pointer-events: none;
        }
        .game-container::before {
            top: -2px; left: -2px;
            border-right: none; border-bottom: none;
            border-top-left-radius: 20px;
        }
        .game-container::after {
            bottom: -2px; right: -2px;
            border-left: none; border-top: none;
            border-bottom-right-radius: 20px;
        }

        .level-tag {
            display: block;
            width: fit-content;
            margin: 0 auto 12px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
            padding: 4px 14px;
            border-radius: 999px;
            text-shadow: 0 0 8px var(--accent);
        }
        .game-title {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1.35;
            margin: 0 0 10px;
            background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 12px rgba(34,211,238,.45));
        }
        .game-subtitle {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--muted);
            margin: 0 0 28px;
            line-height: 1.6;
        }
        .game-subtitle #characterName {
            color: var(--accent);
            font-weight: 900;
            text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 50%, transparent);
        }

        .main-content-wrapper {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .maze-container {
            flex-shrink: 0;
            margin-bottom: 0;
        }
        .controls-area-wrapper {
            flex-grow: 1;
            min-width: min(350px, 100%);
        }

        .maze-grid {
            --cell: 80px;
            display: grid;
            grid-template-columns: repeat(5, var(--cell));
            grid-template-rows: repeat(5, var(--cell));
            gap: 2px;
            background-image: url(".//data/03.png");
            background-size: cover;
            background-position: center;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid color-mix(in srgb, var(--accent) 70%, #fff);
            box-shadow:
                0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent),
                0 0 24px color-mix(in srgb, var(--accent) 30%, transparent);
        }
        .maze-cell {
            background: transparent;
            border: 2px solid rgba(207,250,254,.92);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 24px;
            box-shadow: inset 0 0 0 1px rgba(7,11,26,.15);
        }
        
        .trap-img {
            max-width: 65%;
            max-height: 65%;
            object-fit: contain;
            opacity: 0.8;
        }
        .character-img {
            max-width: 60%;
            max-height: 60%;
            transition: transform 0.3s ease;
            object-fit: contain;
        }
        .treasure-img {
            max-width: 70%;
            max-height: 70%;
            transition: transform 0.3s ease;
            object-fit: contain;
        }
        .character {
            position: absolute;
            transform: translate(15%, 0%);
        }
        .treasure {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 95%;
            height: 95%;
        }
        .direction-indicator {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 12px;
            display: block;
            z-index: 10;
            background: rgba(7,11,26,.65);
            border-radius: 6px;
            padding: 0 3px;
            line-height: 1.3;
        }
        

        .controls-section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 15px;
            color: #fff;
            letter-spacing: 1px;
        }
        .section-title::before {
            content: "// ";
            font-family: Consolas, 'Courier New', monospace;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 0;
        }

        .command-tokens {
            display: flex;
            gap: 15px;
            justify-content: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .command-token {
            width: 110px;
            height: 160px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: grab;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            border-radius: 10px;
            filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 25%, transparent));
        }
        .command-token:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
            filter: drop-shadow(0 0 10px var(--accent));
        }
        .command-token:active {
            cursor: grabbing;
            transform: scale(0.95);
        }
        
        .token-a { background-image: url("./data/101.png"); /* A 前進 */ }
        .token-b { background-image: url("./data/102.png"); /* B 左轉 */ }
        .token-c { background-image: url("./data/103.png"); /* C 右轉 */ }
        .token-d { background-image: url("./data/201.png"); /* D: 重複 2 次 */ }
        .token-e { background-image: url("./data/202.png"); /* E: 重複 3 次 */ }
        
        .sequence-token.token-a { background-image: var(--icon-101); }
        .sequence-token.token-b { background-image: var(--icon-102); }
        .sequence-token.token-c { background-image: var(--icon-103); }
        .sequence-token.token-d { background-image: var(--icon-201); }
        .sequence-token.token-e { background-image: var(--icon-202); }

        .command-token.token-a { background-image: var(--icon-101); --tc: #22d3ee; }
        .command-token.token-b { background-image: var(--icon-102); --tc: #a78bfa; }
        .command-token.token-c { background-image: var(--icon-103); --tc: #f472b6; }
        .command-token.token-d { background-image: var(--icon-201); --tc: #fbbf24; }
        .command-token.token-e { background-image: var(--icon-202); --tc: #a3e635; }

        .command-token > div,
        .sequence-token > div {
            display: none !important;
        }

        .sequence-area {
            min-height: 150px;
            border: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent);
            border-radius: 15px;
            padding: 10px;
            background: rgba(7,11,26,.45);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }
        .sequence-area.drag-over {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 16%, rgba(7,11,26,.45));
            box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 40%, transparent);
        }
        .sequence-token {
            width: 90px;
            height: 130px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            position: relative;
        }
        .sequence-token .remove-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 22px;
            height: 22px;
            background: #e11d48;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px rgba(225,29,72,.7);
            line-height: 1;
            padding: 0;
        }

        .game-controls {
            display: flex;
            gap: 15px;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 0;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 24px;
            border: none;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 900;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            letter-spacing: 1px;
            line-height: 1.3;
        }
        .btn-primary {
            background: var(--accent);
            color: var(--bg);
            box-shadow: 0 0 14px var(--accent);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 22px var(--accent);
            filter: brightness(1.08);
        }
        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 2px solid #94a3b8;
            box-shadow: 0 0 8px rgba(148,163,184,.25);
        }
        .btn-secondary:hover {
            border-color: #e2e8f0;
            transform: translateY(-2px);
            box-shadow: 0 0 14px rgba(226,232,240,.3);
        }
        .btn-home {
            background: transparent;
            color: var(--lime);
            border: 2px solid color-mix(in srgb, var(--lime) 70%, transparent);
            text-shadow: 0 0 8px rgba(163,230,53,.6);
        }
        .btn-home:hover {
            background: color-mix(in srgb, var(--lime) 16%, transparent);
            transform: translateY(-2px);
            box-shadow: 0 0 14px rgba(163,230,53,.4);
        }
        .btn:disabled {
            background: #334155;
            color: #94a3b8;
            border-color: transparent;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            filter: none;
            text-shadow: none;
        }

        .status-area {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            background: transparent;
            padding: 0;
            border-radius: 0;
            margin-bottom: 20px;
        }
        .result-message {
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 0;
            min-height: 20px;
        }
        .result-message:empty {
            display: none;
            padding: 0;
            min-height: 0;
        }
        .success {
            background: rgba(163,230,53,.16);
            color: #d9f99d;
            border: 2px solid var(--lime);
            text-shadow: 0 0 8px rgba(163,230,53,.55);
        }
        .failure {
            background: rgba(244,114,182,.14);
            color: #fecdd3;
            border: 2px solid #fb7185;
            text-shadow: 0 0 8px rgba(251,113,133,.45);
        }
        .empty-sequence {
            color: var(--muted);
            font-style: normal;
            font-weight: 700;
            text-align: center;
            width: 100%;
        }

        @media (max-width: 820px) {
            .game-title { font-size: 26px; }
            .game-container { padding: 28px 20px 24px; }
        }
        @media (max-width: 520px) {
            body { padding: 12px; }
            .game-container { padding: 24px 14px 18px; }
            .game-title { font-size: 22px; letter-spacing: 1px; }
            .game-subtitle { font-size: 16px; margin-bottom: 20px; }
            .maze-grid { --cell: 68px; padding: 8px; }
            .command-token { width: 78px; height: 114px; }
            .sequence-token { width: 68px; height: 98px; }
            .sequence-area { min-height: 118px; }
            .btn { font-size: 15px; padding: 8px 16px; }
            .controls-area-wrapper { min-width: 0; width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            body::after { animation: none; }
            .command-token, .btn, .character, .character-img, .treasure-img, .sequence-area {
                transition: none;
            }
        }
    
    </style>

        window.ESPRA_SELECT = function (page, lv, source) {
            const S = { P01: ['seq', '循序'], P02: ['rep', '重複'], P03: ['sel', '選擇'] }[page];
            if (!S) return;
            window.dataLayer = window.dataLayer || [];

                event: 'level_select',
                level_id: S[0] + '_' + ['easy', 'medium', 'hard'][lv - 1],
                level_page: page + '_lv' + lv,
                level_number: (Number(page.slice(1)) - 1) * 3 + lv,
                structure: S[1],
                difficulty: ['易', '中', '難'][lv - 1],
                card_limit: undefined, card_count: undefined, attempt_number: undefined,
                time_spent_sec: undefined, fail_reason: undefined, rock_bumps: undefined, first_clear: undefined,
                select_source: source
            });
        };
        const ESPRA_TRACK = (() => {
            const DIFF_KEYS = ['easy', 'medium', 'hard'];
            const base = {
                level_id: STRUCT.key + '_' + DIFF_KEYS[LV - 1],          // 例 seq_easy / rep_hard / sel_medium
                level_page: STRUCT.file.replace('.html', '') + '_lv' + LV, // 例 P01_lv1

                            first_clear: undefined };
            const t0 = Date.now();
            const key = 'espra_attempts_' + base.level_id;
            let attempts = 0;
            try { attempts = Number(sessionStorage.getItem(key)) || 0; } catch (e) {}
            const run = { active: false, bumps: 0, reason: null, won: false, reset: false };
            function push(event, extra) {
                window.dataLayer = window.dataLayer || [];
                window.dataLayer.push(Object.assign({ event: event }, base, EMPTY, extra || {}));
            }
            return {
                base, run, push,
                secs: () => Math.round((Date.now() - t0) / 1000),
                nextAttempt() {

            host.dataset.lv = String(LV);
            document.getElementById('commandTokens').innerHTML = LEVEL.cards.map(c =>
                `<div class="command-token token-${c.toLowerCase()}" draggable="true" data-command="${c}"><div>${c}</div>${CARD_INFO[c]}</div>`
            ).join('');
            document.getElementById('gameSubtitle').innerHTML = LEVEL.subtitle.replace('機器人', '<span id="characterName">機器人</span>');
            const nav = document.getElementById('diffNav');
            nav.innerHTML = DIFF_NAMES.map((d, i) => {
                const cur = i + 1 === LV;
                return `<a class="diff-pill${cur ? ' is-current' : ''}" href="${STRUCT.file}?lv=${i + 1}"${cur ? ' aria-current="page"' : ''} title="${STRUCT.name}・${d}">${d}</a>`;
            }).join('');
        })();

        // 下一關：同結構的下一個難度；難 → 下一個結構的 易；最後一關 → 回首頁
        function nextLevelLink() {
            if (LV < 3) return { href: `${STRUCT.file}?lv=${LV + 1}`, label: `下一關：${DIFF_NAMES[LV]} ▶` };
            if (STRUCT.nextFile) return { href: `${STRUCT.nextFile}?lv=1`, label: `下一關：${STRUCT.nextName} ▶` };
            return { href: 'index.html', label: '回首頁選關 ▶' };
        }

        // **新增**：判斷一個位置是否為障礙物
        function isObstacle(x, y) {
             return TRAPS.some(trap => trap.x === x && trap.y === y);
        }
        
        // --- 核心遊戲函數 ---

        function initMaze() {
            const mazeGrid = document.getElementById('mazeGrid');
            
            // 清空迷宮容器內容，準備重新繪製所有格線和內容
            mazeGrid.innerHTML = ''; 
            
            for (let row = 0; row < MAZE_SIZE; row++) {
                for (let col = 0; col < MAZE_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'maze-cell';
                    cell.id = `cell-${row}-${col}`;
                    
                    // 障礙物圖片設定
                    if (isObstacle(row, col)) {
                         cell.innerHTML = `<img src="${TRAP_IMAGES[(row + col) % TRAP_IMAGES.length]}" alt="石頭" class="trap-img">`;
                    }
                    
                    // 寶藏圖片設定
                    if (row === TREASURE_POS.x && col === TREASURE_POS.y) {
                         cell.innerHTML = `
                            <span class="treasure">
                                <img src="${TREASURE_IMAGE_URL}" alt="樹苗" class="treasure-img">
                            </span>
                        `;
                    }
                    
                    mazeGrid.appendChild(cell);
                }
            }
            
            const cn = document.getElementById('characterName'); if (cn) cn.textContent = defaultConfig.character_name;
            document.getElementById('gameTitle').textContent = defaultConfig.game_title;
            
            // 放置初始角色
            updatePlayerPosition();
        }

        function updatePlayerPosition() {
            // 移除舊的角色和箭頭，準備在新的位置重新繪製
            document.querySelectorAll('.character').forEach(char => char.remove());
            document.querySelectorAll('.direction-indicator').forEach(indicator => indicator.remove());
            
            const cell = document.getElementById(`cell-${gameState.playerPos.x}-${gameState.playerPos.y}`);
            if (cell) {
                // *** 移除陷阱檢查：主角踏入障礙物不再立即失敗 ***
                // if (TRAPS.some(trap => trap.x === gameState.playerPos.x && trap.y === gameState.playerPos.y)) {
                //     gameState.gameEnded = true;
                //     showResult(false, "掉入陷阱！遊戲失敗！");
                //     return; 
                // }

                const character = document.createElement('span');
                character.className = 'character';
                
                // 角色圖片設定
                character.innerHTML = `
                    <img src="${ROBOT_IMAGE_URL}" alt="${defaultConfig.character_name}" class="character-img" id="playerImage">
                `; 
                
                // 根據 playerRotation 旋轉圖片
                const playerImage = character.querySelector('#playerImage');
                if(playerImage) {
                    playerImage.style.transform = `rotate(${gameState.playerRotation}deg)`;
                }

                const directionIndicator = document.createElement('span');
                directionIndicator.className = 'direction-indicator';
                // 保留箭頭顯示
                directionIndicator.textContent = DIRECTIONS[gameState.playerDirection]; 
                
                cell.appendChild(character);
                cell.appendChild(directionIndicator);
            }
        }

        function setupDragAndDrop() {
            const tokens = document.querySelectorAll('.command-token');
            const sequenceArea = document.getElementById('sequenceArea');

            tokens.forEach(token => {
                token.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', e.target.dataset.command);
                });
                token.addEventListener('click', (e) => {
                    const command = e.currentTarget.dataset.command;
                    if (command && !gameState.isExecuting) { 
                        addToSequence(command);
                    }
                });
            });

            sequenceArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                sequenceArea.classList.add('drag-over');
            });
            sequenceArea.addEventListener('dragleave', () => {
                sequenceArea.classList.remove('drag-over');
            });
            sequenceArea.addEventListener('drop', (e) => {
                e.preventDefault();
                sequenceArea.classList.remove('drag-over');
                const command = e.dataTransfer.getData('text/plain');
                if (command && !gameState.isExecuting) {
                    const box = e.target.closest && e.target.closest('.loop-box');
                    if (box && !isRepeat(command)) gameState.openLoop = Number(box.dataset.loop);
                    addToSequence(command);
                }
            });
        }

        // ===== 重複框：重複牌會重複「框內（後面）」那一組指令 =====
        // sequence 項目：'A' | 'B' | 'C'，或 { repeat: 'D'|'E', body: ['A', ...] }
        const REPEAT_TIMES = { D: 2, E: 3 };
        const COMMAND_TEXT = { A: '前進一格', B: '原地左轉', C: '原地右轉', D: '以下步驟重複 2 次', E: '以下步驟重複 3 次', F: '前進；若前方沒路就左轉', G: '前進；若前方沒路就右轉' };
        const HAS_REPEAT = LEVEL.cards.some(c => c === 'D' || c === 'E');
        function cardCount() { return gameState.sequence.reduce((n, it) => n + (typeof it === 'string' ? 1 : 1 + it.body.length), 0); }
        function isRepeat(c) { return c === 'D' || c === 'E'; }

        function showSeqHint(msg) {
            let h = document.getElementById('seqHint');
            if (!h) {
                h = document.createElement('div');
                h.id = 'seqHint';
                h.className = 'seq-hint';
                h.setAttribute('role', 'status');
                const area = document.getElementById('sequenceArea');
                area.parentNode.insertBefore(h, area);
            }
            h.textContent = msg;
            h.classList.add('show');
            clearTimeout(h._t);
            h._t = setTimeout(() => h.classList.remove('show'), 3200);
        }

        function addToSequence(command) {
            const seq = gameState.sequence;
            if (CARD_LIMIT && cardCount() >= CARD_LIMIT) {
                showSeqHint(`這關最多只能用 ${CARD_LIMIT} 張指令牌，請先移除不需要的牌。`);
                return;
            }
            const open = gameState.openLoop !== null ? seq[gameState.openLoop] : null;
            if (isRepeat(command)) {
                if (open) {
                    showSeqHint('重複框裡不能再放重複牌，請先按「結束重複」。');
                    return;
                }
                seq.push({ repeat: command, body: [] });
                gameState.openLoop = seq.length - 1;
                showSeqHint('接著點要重複的指令牌放進框裡，放好後按「結束重複」。');
            } else if (open && open.body) {
                open.body.push(command);
            } else {
                seq.push(command);
            }
            updateSequenceDisplay();
        }

        // inner === undefined：刪除外面的指令牌或整個重複牌（框內的指令牌會移到框外，不會消失）
        window.removeFromSequence = function(index, inner) {
            if (gameState.isExecuting) return;
            const seq = gameState.sequence;
            const item = seq[index];
            if (!item) return;
            if (inner !== undefined && item.body) {
                item.body.splice(inner, 1);
            } else if (item.body) {
                seq.splice(index, 1, ...item.body);
                if (gameState.openLoop === index) gameState.openLoop = null;
                else if (gameState.openLoop !== null && gameState.openLoop > index) gameState.openLoop += item.body.length - 1;
            } else {
                seq.splice(index, 1);
                if (gameState.openLoop !== null && gameState.openLoop > index) gameState.openLoop -= 1;
            }
            updateSequenceDisplay();
        }

        window.closeLoop = function() {
            gameState.openLoop = null;
            const h = document.getElementById('seqHint');
            if (h) h.classList.remove('show');
            updateSequenceDisplay();
        }

        window.openLoopAt = function(index) {
            if (gameState.isExecuting) return;
            const item = gameState.sequence[index];
            if (item && item.body) {
                gameState.openLoop = index;
                updateSequenceDisplay();
            }
        }

        function makeSeqToken(command, key, onRemove) {
            const token = document.createElement('div');
            token.className = `sequence-token token-${command.toLowerCase()}`;
            token.dataset.key = key;
            token.innerHTML = `
                <div>${command}</div>
                <div style="font-size: 10px;">${COMMAND_TEXT[command]}</div>
                <button class="remove-btn" type="button" aria-label="移除">×</button>
            `;
            token.querySelector('.remove-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                onRemove();
            });
            return token;
        }

        function updateSequenceDisplay() {
            const sequenceArea = document.getElementById('sequenceArea');
            const seq = gameState.sequence;
            if (gameState.openLoop !== null && !(seq[gameState.openLoop] && seq[gameState.openLoop].body)) gameState.openLoop = null;
            if (seq.length === 0) {
                sequenceArea.innerHTML = HAS_REPEAT
                    ? '<div class="empty-sequence">將指令牌拖曳到這裡<br><small>「以下步驟重複 N 次」牌會開一個框，框裡的步驟會一起重複</small></div>'
                    : '<div class="empty-sequence">將指令牌拖曳到這裡</div>';
                return;
            }

            sequenceArea.innerHTML = '';
            seq.forEach((item, index) => {
                if (typeof item === 'string') {
                    sequenceArea.appendChild(makeSeqToken(item, String(index), () => removeFromSequence(index)));
                    return;
                }
                const isOpen = gameState.openLoop === index;
                const times = REPEAT_TIMES[item.repeat];
                const box = document.createElement('div');
                box.className = 'loop-box' + (isOpen ? ' is-open' : '');
                box.dataset.loop = String(index);
                box.setAttribute('aria-label', `以下步驟重複 ${times} 次的框`);

                const head = document.createElement('div');
                head.className = 'loop-head';
                head.appendChild(makeSeqToken(item.repeat, index + ':h', () => removeFromSequence(index)));
                const pass = document.createElement('span');
                pass.className = 'loop-pass';
                head.appendChild(pass);

                const body = document.createElement('div');
                body.className = 'loop-body';
                item.body.forEach((c, j) => {
                    body.appendChild(makeSeqToken(c, index + ':' + j, () => removeFromSequence(index, j)));
                });
                if (isOpen || item.body.length === 0) {
                    const slot = document.createElement('div');
                    slot.className = 'loop-slot';
                    slot.textContent = isOpen ? '＋ 點指令牌放進框裡' : '空的，點一下框來放入指令';
                    body.appendChild(slot);
                }

                box.appendChild(head);
                box.appendChild(body);
                if (isOpen) {
                    const done = document.createElement('button');
                    done.type = 'button';
                    done.className = 'loop-done';
                    done.textContent = '結束重複';
                    done.addEventListener('click', (e) => { e.stopPropagation(); closeLoop(); });
                    box.appendChild(done);
                } else {
                    const tip = document.createElement('div');
                    tip.className = 'loop-tip';
                    tip.textContent = '點框可再加入';
                    box.appendChild(tip);
                    box.addEventListener('click', () => openLoopAt(index));
                }
                sequenceArea.appendChild(box);
            });
        }
        
        function isValidPosition(x, y) {
            const inBounds = x >= 0 && x < MAZE_SIZE && y >= 0 && y < MAZE_SIZE;
            
            // **關鍵修改**：如果位置在邊界內，但有障礙物，則視為無效位置（不可通行）
            if (inBounds && isObstacle(x, y)) {
                return false; 
            }

            return inBounds;
        }

        function getFrontPosition() {
            const directions = [
                { x: -1, y: 0 }, // 上 (0)
                { x: 0, y: 1 },  // 右 (1)
                { x: 1, y: 0 },  // 下 (2)
                { x: 0, y: -1 }  // 左 (3)
            ];
            const dir = directions[gameState.playerDirection];
            return {
                x: gameState.playerPos.x + dir.x,
                y: gameState.playerPos.y + dir.y
            };
        }
        
        // 執行一個原子操作 (A, B, 或 C)
        async function executeAtomicCommand(command) {
              return new Promise(resolve => {
                  setTimeout(() => {
                      if (gameState.gameEnded) {
                          resolve();
                          return;
                      }
                      
                      switch (command) {
                          case 'A': // 前進一格
                              const frontPos = getFrontPosition();
                              const canMoveForward = isValidPosition(frontPos.x, frontPos.y);
                              
                              if (canMoveForward) {
                                  gameState.playerPos = frontPos;
                              } else {
                                  // 檢查撞到的是邊界牆還是障礙物 (障礙物在 isValidPosition 中已排除)
                                  const isWall = frontPos.x < 0 || frontPos.x >= MAZE_SIZE || frontPos.y < 0 || frontPos.y >= MAZE_SIZE;

                                  if (isWall) {
                                      // 撞到邊界牆，遊戲失敗
                                      ESPRA_TRACK.run.reason = 'out_of_bounds';
                                      gameState.gameEnded = true;
                                      showResult(false, "超出迷宮邊界！移動失敗！");
                                  } else {
                                      // 撞到障礙物 (isObstacle(frontPos.x, frontPos.y) 為 true)，停在原地，指令無效
                                      ESPRA_TRACK.run.bumps += 1;
                                  }
                              }
                              break;
                          case 'B': // 原地左轉 (逆時針 90 度)
                              gameState.playerDirection = (gameState.playerDirection + 3) % 4;
                              gameState.playerRotation -= 90; // 逆時針
                              break;
                          case 'C': // 原地右轉 (順時針 90 度)
                              gameState.playerDirection = (gameState.playerDirection + 1) % 4;
                              gameState.playerRotation += 90; // 順時針
                              break;
                          case 'F': // 選擇結構：前進；若前方沒路（邊界或石頭）就左轉
                          case 'G': // 選擇結構：前進；若前方沒路（邊界或石頭）就右轉
                              {
                                  const fp = getFrontPosition();
                                  if (isValidPosition(fp.x, fp.y)) {
                                      gameState.playerPos = fp;
                                  } else if (command === 'F') {
                                      gameState.playerDirection = (gameState.playerDirection + 3) % 4;
                                      gameState.playerRotation -= 90;
                                  } else {
                                      gameState.playerDirection = (gameState.playerDirection + 1) % 4;
                                      gameState.playerRotation += 90;
                                  }
                              }
                              break;
                      }
                      
                      updatePlayerPosition();
                      
                      // 檢查是否到達寶藏
                      if (!gameState.gameEnded && gameState.playerPos.x === TREASURE_POS.x && gameState.playerPos.y === TREASURE_POS.y) {
                          gameState.gameEnded = true;
                          ESPRA_TRACK.run.won = true;
                          const config = window.elementSdk?.config || defaultConfig;
                          showResult(true, config.success_message || defaultConfig.success_message);
                      }
                      
                      resolve();
                  }, 500); // 每次原子操作延遲 500ms
              });
        }
        
        // 執行指令序列：重複框會把框內那一組指令重複 N 次
        // 每次按「執行」都從起點重新開始（保留指令序列）
        let ranOnce = false, restarting = false;
        const pause = (ms) => new Promise(res => setTimeout(res, ms));
        async function backToStart() {
            const keep = gameState.sequence;
            const robot = document.querySelector('.sprite-layer .robot');
            if (robot && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                robot.style.transition = 'opacity .16s ease-out';
                robot.style.opacity = '0';
                await pause(170);
            }
            resetGame();                     // board, robot, goal, messages, loop counters
            gameState.sequence = keep;
            updateSequenceDisplay();
            document.getElementById('executeBtn').disabled = true;
            const fresh = document.querySelector('.sprite-layer .robot');
            if (fresh) {
                fresh.style.transition = 'none';
                fresh.style.opacity = '0';
                void fresh.offsetWidth;
                fresh.style.transition = 'opacity .2s ease-in';
                fresh.style.opacity = '1';
            }
            await pause(320);
        }
        async function executeSequence() {
            if (gameState.sequence.length === 0 || gameState.isExecuting || restarting) return;

            // 還開著的重複框，執行前自動結束
            if (gameState.openLoop !== null) {
                gameState.openLoop = null;
                updateSequenceDisplay();
            }
            const emptyLoop = gameState.sequence.find(it => typeof it !== 'string' && it.body.length === 0);
            if (emptyLoop) {
                showResult(false, `「${COMMAND_TEXT[emptyLoop.repeat]}」的框裡還沒有指令牌，請先把要重複的動作放進框裡！`);
                return;
            }
            
            if (ranOnce || gameState.gameEnded ||
                gameState.playerPos.x !== START.x || gameState.playerPos.y !== START.y ||
                gameState.playerDirection !== START.dir) {
                restarting = true;
                document.getElementById('executeBtn').disabled = true;
                try { await backToStart(); } finally { restarting = false; }
                // 重置鍵在回到起點的途中被按下：序列已清空，就不執行
                if (gameState.isExecuting || gameState.sequence.length === 0) {
                    document.getElementById('executeBtn').disabled = false;
                    return;
                }
            }
            ranOnce = true;
            {
                const R = ESPRA_TRACK.run;
                R.active = true; R.bumps = 0; R.reason = null; R.won = false; R.reset = false;
                R.cards = cardCount(); R.attempt = ESPRA_TRACK.nextAttempt();
                ESPRA_TRACK.push('level_run', { card_count: R.cards, attempt_number: R.attempt });
            }
            gameState.isExecuting = true;
            document.getElementById('executeBtn').disabled = true;
            document.getElementById('resultMessage').textContent = '';
            document.getElementById('resultMessage').className = 'result-message';

            // 執行進度：已執行的指令牌變灰階、正在執行的保持亮色並標示
            const area = document.getElementById('sequenceArea');
            const tok = (key) => area.querySelector(`.sequence-token[data-key="${key}"]`);
            area.querySelectorAll('.sequence-token').forEach(t => t.classList.remove('is-done', 'is-active'));
            area.querySelectorAll('.loop-pass').forEach(p => { p.textContent = ''; });
            const markActive = (t) => { if (t) t.classList.add('is-active'); };
            const markDone = (t) => { if (t) { t.classList.remove('is-active'); t.classList.add('is-done'); } };

            const seq = gameState.sequence;
            for (let index = 0; index < seq.length && !gameState.gameEnded; index++) {
                const item = seq[index];
                if (typeof item === 'string') {
                    const t = tok(String(index));
                    markActive(t);
                    await executeAtomicCommand(item);
                    markDone(t);
                    continue;
                }
                const times = REPEAT_TIMES[item.repeat];
                const head = tok(index + ':h');
                const box = head && head.closest('.loop-box');
                const pass = box && box.querySelector('.loop-pass');
                markActive(head);
                if (box) box.classList.add('is-running');
                for (let p = 0; p < times && !gameState.gameEnded; p++) {
                    if (pass) pass.textContent = `第 ${p + 1}/${times} 次`;
                    item.body.forEach((c, j) => { const t = tok(index + ':' + j); if (t) t.classList.remove('is-done', 'is-active'); });
                    for (let j = 0; j < item.body.length && !gameState.gameEnded; j++) {
                        const t = tok(index + ':' + j);
                        markActive(t);
                        await executeAtomicCommand(item.body[j]);
                        markDone(t);
                    }
                }
                markDone(head);
                if (box) box.classList.remove('is-running');
            }
            
            gameState.isExecuting = false;
            document.getElementById('executeBtn').disabled = false;
            
            if (!gameState.gameEnded) {
                showResult(false, "指令執行完畢，還沒走到樹苗，試試調整指令序列！");
            }
            {
                const R = ESPRA_TRACK.run;
                if (R.active) {
                    R.active = false;
                    const common = { card_count: R.cards, attempt_number: R.attempt,
                                     time_spent_sec: ESPRA_TRACK.secs(), rock_bumps: R.bumps };
                    if (R.won && !R.reset) {
                        let first = 1;
                        try { const k = 'espra_cleared_' + ESPRA_TRACK.base.level_id;
                              first = sessionStorage.getItem(k) ? 0 : 1; sessionStorage.setItem(k, '1'); } catch (e) {}
                        ESPRA_TRACK.push('level_complete', Object.assign(common, { first_clear: first }));
                    } else {
                        const reason = R.reset ? 'reset_during_run'
                                     : R.reason || (R.bumps > 0 ? 'hit_rock' : 'not_reached');
                        ESPRA_TRACK.push('level_fail', Object.assign(common, { fail_reason: reason }));
                    }
                }
            }
        }

        function showResult(success, message) {
            const resultDiv = document.getElementById('resultMessage');
            resultDiv.textContent = message;
            resultDiv.className = `result-message ${success ? 'success' : 'failure'}`;
            if (success) {
                const nx = nextLevelLink();
                const a = document.createElement('a');
                a.className = 'next-level';
                a.href = nx.href;
                a.textContent = nx.label;
                resultDiv.appendChild(a);
            }
        }

        function resetGame() {
            ranOnce = false;
            gameState = {
                playerPos: { x: START.x, y: START.y },
                playerDirection: START.dir,
                playerRotation: 0, 
                sequence: [],
                openLoop: null,
                isExecuting: false,
                gameEnded: false
            };
            
            // 重新初始化迷宮（這會包含更新角色位置）
            initMaze(); 
            updateSequenceDisplay();
            document.getElementById('resultMessage').textContent = '';
            document.getElementById('resultMessage').className = 'result-message';
            document.getElementById('executeBtn').disabled = false;
        }

        // --- 事件監聽器與初始化 ---
        document.getElementById('executeBtn').addEventListener('click', executeSequence);
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (ESPRA_TRACK.run.active) ESPRA_TRACK.run.reset = true;
            ESPRA_TRACK.push('level_reset', { card_count: cardCount(), attempt_number: ESPRA_TRACK.attempts(),
                                              time_spent_sec: ESPRA_TRACK.secs() });
        });
        document.getElementById('resetBtn').addEventListener('click', resetGame);
        // 關卡內切換難度／下一關的連結也記為 level_select
        document.addEventListener('click', (ev) => {
            const a = ev.target.closest && ev.target.closest('a.diff-pill, a.next-level');
            if (!a) return;
