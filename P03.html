<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <title>淡蘭試煉迷宮：選擇結構</title>
    
    <style>
        :root {
            --bg: #070b1a;
            --panel: rgba(15,23,48,.72);
            --cyan: #22d3ee;
            --pink: #f472b6;
            --lime: #a3e635;
            --violet: #a78bfa;
            --text: #e2e8f0;
            --muted: #cbd5e1;
            --accent: #f472b6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: 'Noto Sans TC', '微軟正黑體', 'Microsoft JhengHei', system-ui, sans-serif;
            font-weight: 500;
            color: var(--text);
            background: var(--bg);
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(244,114,182,.20), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(167,139,250,.14), transparent 40%),
                linear-gradient(rgba(34,211,238,.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34,211,238,.07) 1px, transparent 1px);
            background-size: auto, auto, 40px 40px, 40px 40px;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            background: linear-gradient(transparent 0, rgba(34,211,238,.06) 50%, transparent 100%);
            height: 200px;
            animation: scan 6s linear infinite;
        }
        @keyframes scan {
            from { transform: translateY(-200px); }
            to { transform: translateY(100vh); }
        }

        .game-container {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
            padding: 36px 36px 32px;
            background: var(--panel);
            backdrop-filter: blur(8px);
            border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
            border-radius: 20px;
            box-shadow:
                0 0 0 1px rgba(167,139,250,.15),
                0 0 40px color-mix(in srgb, var(--accent) 22%, transparent),
                inset 0 0 60px rgba(34,211,238,.05);
        }
        .game-container::before,
        .game-container::after {
            content: "";
            position: absolute;
            width: 28px;
            height: 28px;
            border: 3px solid var(--accent);
            filter: drop-shadow(0 0 6px var(--accent));
            pointer-events: none;
        }
        .game-container::before {
            top: -2px; left: -2px;
            border-right: none; border-bottom: none;
            border-top-left-radius: 20px;
        }
        .game-container::after {
            bottom: -2px; right: -2px;
            border-left: none; border-top: none;
            border-bottom-right-radius: 20px;
        }

        .level-tag {
            display: block;
            width: fit-content;
            margin: 0 auto 12px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
            padding: 4px 14px;
            border-radius: 999px;
            text-shadow: 0 0 8px var(--accent);
        }
        .game-title {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1.35;
            margin: 0 0 10px;
            background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 12px rgba(34,211,238,.45));
        }
        .game-subtitle {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--muted);
            margin: 0 0 28px;
            line-height: 1.6;
        }
        .game-subtitle #characterName {
            color: var(--accent);
            font-weight: 900;
            text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 50%, transparent);
        }

        .main-content-wrapper {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .maze-container {
            flex-shrink: 0;
            margin-bottom: 0;
        }
        .controls-area-wrapper {
            flex-grow: 1;
            min-width: min(350px, 100%);
        }

        .maze-grid {
            --cell: 80px;
            display: grid;
            grid-template-columns: repeat(4, var(--cell));
            grid-template-rows: repeat(4, var(--cell));
            gap: 2px;
            background-image: url(".//data/03.png");
            background-size: cover;
            background-position: center;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid color-mix(in srgb, var(--accent) 70%, #fff);
            box-shadow:
                0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent),
                0 0 24px color-mix(in srgb, var(--accent) 30%, transparent);
        }
        .maze-cell {
            background: transparent;
            border: 2px solid rgba(207,250,254,.92);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 24px;
            box-shadow: inset 0 0 0 1px rgba(7,11,26,.15);
        }
        
        .trap-img {
            max-width: 65%;
            max-height: 65%;
            object-fit: contain;
            opacity: 0.8;
        }
        .character-img {
            max-width: 60%;
            max-height: 60%;
            transition: transform 0.3s ease;
            object-fit: contain;
        }
        .treasure-img {
            max-width: 70%;
            max-height: 70%;
            transition: transform 0.3s ease;
            object-fit: contain;
        }
        .character {
            position: absolute;
            transform: translate(15%, 0%);
        }
        .treasure {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 95%;
            height: 95%;
        }
        .direction-indicator {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 12px;
            display: block;
            z-index: 10;
            background: rgba(7,11,26,.65);
            border-radius: 6px;
            padding: 0 3px;
            line-height: 1.3;
        }
        

        .controls-section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 15px;
            color: #fff;
            letter-spacing: 1px;
        }
        .section-title::before {
            content: "// ";
            font-family: Consolas, 'Courier New', monospace;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 0;
        }

        .command-tokens {
            display: flex;
            gap: 15px;
            justify-content: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .command-token {
            width: 110px;
            height: 160px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: grab;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            border-radius: 10px;
            filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 25%, transparent));
        }
        .command-token:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
            filter: drop-shadow(0 0 10px var(--accent));
        }
        .command-token:active {
            cursor: grabbing;
            transform: scale(0.95);
        }
        
        .token-a { background-image: url("./data/101.png"); /* A 前進 */ }
        .token-b { background-image: url("./data/102.png"); /* B 左轉 */ }
        .token-c { background-image: url("./data/301.png"); /* C 前進或左轉 */ }
        .token-d { background-image: url("./data/302.png"); /* D 前進或右轉 */ }
        
        .command-token > div,
        .sequence-token > div {
            display: none !important;
        }

        .sequence-area {
            min-height: 150px;
            border: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent);
            border-radius: 15px;
            padding: 10px;
            background: rgba(7,11,26,.45);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }
        .sequence-area.drag-over {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 16%, rgba(7,11,26,.45));
            box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 40%, transparent);
        }
        .sequence-token {
            width: 90px;
            height: 130px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            position: relative;
        }
        .sequence-token .remove-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 22px;
            height: 22px;
            background: #e11d48;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px rgba(225,29,72,.7);
            line-height: 1;
            padding: 0;
        }

        .game-controls {
            display: flex;
            gap: 15px;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 0;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 24px;
            border: none;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 900;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            letter-spacing: 1px;
            line-height: 1.3;
        }
        .btn-primary {
            background: var(--accent);
            color: var(--bg);
            box-shadow: 0 0 14px var(--accent);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 22px var(--accent);
            filter: brightness(1.08);
        }
        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 2px solid #94a3b8;
            box-shadow: 0 0 8px rgba(148,163,184,.25);
        }
        .btn-secondary:hover {
            border-color: #e2e8f0;
            transform: translateY(-2px);
            box-shadow: 0 0 14px rgba(226,232,240,.3);
        }
        .btn-home {
            background: transparent;
            color: var(--lime);
            border: 2px solid color-mix(in srgb, var(--lime) 70%, transparent);
            text-shadow: 0 0 8px rgba(163,230,53,.6);
        }
        .btn-home:hover {
            background: color-mix(in srgb, var(--lime) 16%, transparent);
            transform: translateY(-2px);
            box-shadow: 0 0 14px rgba(163,230,53,.4);
        }
        .btn:disabled {
            background: #334155;
            color: #94a3b8;
            border-color: transparent;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            filter: none;
            text-shadow: none;
        }

        .status-area {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            background: transparent;
            padding: 0;
            border-radius: 0;
            margin-bottom: 20px;
        }
        .result-message {
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 0;
            min-height: 20px;
        }
        .result-message:empty {
            display: none;
            padding: 0;
            min-height: 0;
        }
        .success {
            background: rgba(163,230,53,.16);
            color: #d9f99d;
            border: 2px solid var(--lime);
            text-shadow: 0 0 8px rgba(163,230,53,.55);
        }
        .failure {
            background: rgba(244,114,182,.14);
            color: #fecdd3;
            border: 2px solid #fb7185;
            text-shadow: 0 0 8px rgba(251,113,133,.45);
        }
        .empty-sequence {
            color: var(--muted);
            font-style: normal;
            font-weight: 700;
            text-align: center;
            width: 100%;
        }

        @media (max-width: 820px) {
            .game-title { font-size: 26px; }
            .game-container { padding: 28px 20px 24px; }
        }
        @media (max-width: 520px) {
            body { padding: 12px; }
            .game-container { padding: 24px 14px 18px; }
            .game-title { font-size: 22px; letter-spacing: 1px; }
            .game-subtitle { font-size: 16px; margin-bottom: 20px; }
            .maze-grid { --cell: 68px; padding: 8px; }
            .command-token { width: 78px; height: 114px; }
            .sequence-token { width: 68px; height: 98px; }
            .sequence-area { min-height: 118px; }
            .btn { font-size: 15px; padding: 8px 16px; }
            .controls-area-wrapper { min-width: 0; width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            body::after { animation: none; }
            .command-token, .btn, .character, .character-img, .treasure-img, .sequence-area {
                transition: none;
            }
        }
    
    </style>
</head>
<body>
    <div class="game-container">
                <div class="level-tag">LEVEL 03</div>
        <h1 class="game-title" id="gameTitle">淡蘭試煉迷宮：選擇結構</h1>
        <p class="game-subtitle">請利用下列 4 種指令牌，但不超過8張牌，就幫助<span id="characterName">小新</span>取得寶藏。</p>
        
        <div class="main-content-wrapper">
        
            <div class="maze-container">
                <div class="maze-grid" id="mazeGrid">
                    </div>
            </div>
            
            <div class="controls-area-wrapper">
                <div class="controls-section">
                    <div class="section-title">可用指令牌</div>
                    <div class="command-tokens">
                        <div class="command-token token-a" draggable="true" data-command="A">
                            <div>A</div>
                            <div>前進一格</div>
                        </div>
                        <div class="command-token token-b" draggable="true" data-command="B">
                            <div>B</div>
                            <div>原地左轉</div>
                        </div>
                        <div class="command-token token-c" draggable="true" data-command="C">
                            <div>C</div>
                            <div>前進；若前方沒路就左轉</div>
                        </div>
                        <div class="command-token token-d" draggable="true" data-command="D">
                            <div>D</div>
                            <div>前進；若前方沒路就右轉</div>
                        </div>
                    </div>
                </div>
                
                <div class="controls-section">
                    <div class="section-title">指令序列</div>
                    <div class="sequence-area" id="sequenceArea">
                        <div class="empty-sequence">將指令牌拖曳到這裡</div>
                    </div>
                </div>
                
                <div class="status-area">
                    <div class="game-controls">
                        <button class="btn btn-primary" id="executeBtn">執行</button>
                        <button class="btn btn-secondary" id="resetBtn">重置</button>
                        <a href="index.html" class="btn btn-home">🏠HOME</a>

                    </div>
                </div>
                <div class="result-message" id="resultMessage"></div>
            </div>
            
        </div>
    </div>
    
    <script>
        // 遊戲狀態 (Game State)
        let gameState = {
            // 1. 主角座標(2,3)
            playerPos: { x: 2, y: 3 }, 
            // 1. 面朝左 (對應 DIRECTIONS[3])
            playerDirection: 3,      
            // 初始旋轉 0 度，讓圖片面朝左
            playerRotation: 0, 
            sequence: [], 
            isExecuting: false,
            gameEnded: false
        };

        // 迷宮配置
        const MAZE_SIZE = 4;
        const DIRECTIONS = ['⬆️', '➡️', '⬇️', '⬅️'];
        
        const ROBOT_IMAGE_URL = ".//data/05.png";
        const TREASURE_IMAGE_URL = ".//data/02.png";
        const TRAP_IMAGE_URL = ".//data/04.png"; // 障礙物圖片

        // 2. 寶藏座標(3,1)
        const TREASURE_POS = { x: 3, y: 1 }; 

        // 3. 障礙物座標清單 (5個)
        const TRAPS = [
            { x: 1, y: 0 }, 
            { x: 3, y: 0 }, 
            { x: 2, y: 2 }, 
            { x: 0, y: 3 }, 
            { x: 3, y: 3 }
        ];

        // 預設配置
        const defaultConfig = {
            game_title: "淡蘭試煉迷宮：選擇結構", 
            character_name: " 小新 ",
            success_message: "恭喜！ 小新 成功取得寶藏！"
        };
        
        // 判斷一個位置是否為障礙物
        function isObstacle(x, y) {
             return TRAPS.some(trap => trap.x === x && trap.y === y);
        }

        // --- 核心遊戲函數 ---

        function initMaze() {
            const mazeGrid = document.getElementById('mazeGrid');
            
            mazeGrid.innerHTML = ''; 
            
            for (let row = 0; row < MAZE_SIZE; row++) {
                for (let col = 0; col < MAZE_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'maze-cell';
                    cell.id = `cell-${row}-${col}`;
                    
                    // 障礙物圖片設定
                    if (isObstacle(row, col)) {
                         cell.innerHTML = `<img src="${TRAP_IMAGE_URL}" alt="障礙物" class="trap-img">`;
                    }
                    
                    // 寶藏圖片設定
                    if (row === TREASURE_POS.x && col === TREASURE_POS.y) {
                         cell.innerHTML = `
                            <span class="treasure">
                                <img src="${TREASURE_IMAGE_URL}" alt="寶藏" class="treasure-img">
                            </span>
                        `;
                    }
                    
                    mazeGrid.appendChild(cell);
                }
            }
            
            document.getElementById('characterName').textContent = defaultConfig.character_name;
            document.getElementById('gameTitle').textContent = defaultConfig.game_title;
            
            // 放置初始角色
            updatePlayerPosition();
        }

        function updatePlayerPosition() {
            // 移除舊的角色和箭頭
            document.querySelectorAll('.character').forEach(char => char.remove());
            document.querySelectorAll('.direction-indicator').forEach(indicator => indicator.remove());
            
            const cell = document.getElementById(`cell-${gameState.playerPos.x}-${gameState.playerPos.y}`);
            if (cell) {
                // 不再檢查陷阱，障礙物僅阻止通行
                const character = document.createElement('span');
                character.className = 'character';
                
                character.innerHTML = `
                    <img src="${ROBOT_IMAGE_URL}" alt="${defaultConfig.character_name}" class="character-img" id="playerImage">
                `; 
                
                // 根據 playerRotation 旋轉圖片
                const playerImage = character.querySelector('#playerImage');
                if(playerImage) {
                    playerImage.style.transform = `rotate(${gameState.playerRotation}deg)`;
                }

                const directionIndicator = document.createElement('span');
                directionIndicator.className = 'direction-indicator';
                directionIndicator.textContent = DIRECTIONS[gameState.playerDirection]; 
                
                cell.appendChild(character);
                cell.appendChild(directionIndicator);
            }
        }

        // 判斷是否為有效位置（在邊界內且非障礙物）
        function isValidPosition(x, y) {
            // 檢查是否在邊界內 
            const inBounds = x >= 0 && x < MAZE_SIZE && y >= 0 && y < MAZE_SIZE;
            
            // 檢查是否為障礙物
            if (inBounds && isObstacle(x, y)) {
                return false; // 在邊界內但有障礙物，視為無效位置
            }

            return inBounds; // 在邊界內且無障礙物，視為有效位置
        }

        function getFrontPosition() {
            const directions = [
                { x: -1, y: 0 }, // 上 (0)
                { x: 0, y: 1 },  // 右 (1)
                { x: 1, y: 0 },  // 下 (2)
                { x: 0, y: -1 }  // 左 (3)
            ];
            const dir = directions[gameState.playerDirection];
            return {
                x: gameState.playerPos.x + dir.x,
                y: gameState.playerPos.y + dir.y
            };
        }

        function setupDragAndDrop() {
            const tokens = document.querySelectorAll('.command-token');
            const sequenceArea = document.getElementById('sequenceArea');

            tokens.forEach(token => {
                token.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', e.target.dataset.command);
                });
                token.addEventListener('click', (e) => {
                    const command = e.currentTarget.dataset.command;
                    if (command && !gameState.isExecuting) { 
                        addToSequence(command);
                    }
                });
            });

            sequenceArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                sequenceArea.classList.add('drag-over');
            });
            sequenceArea.addEventListener('dragleave', () => {
                sequenceArea.classList.remove('drag-over');
            });
            sequenceArea.addEventListener('drop', (e) => {
                e.preventDefault();
                sequenceArea.classList.remove('drag-over');
                const command = e.dataTransfer.getData('text/plain');
                if (command && !gameState.isExecuting) {
                    addToSequence(command);
                }
            });
        }

        function addToSequence(command) {
            gameState.sequence.push(command);
            updateSequenceDisplay();
        }

        window.removeFromSequence = function(index) {
            if (!gameState.isExecuting) {
                gameState.sequence.splice(index, 1);
                updateSequenceDisplay();
            }
        }

        function updateSequenceDisplay() {
            const sequenceArea = document.getElementById('sequenceArea');
            if (gameState.sequence.length === 0) {
                sequenceArea.innerHTML = '<div class="empty-sequence">將指令牌拖曳到這裡</div>';
                return;
            }

            sequenceArea.innerHTML = '';
            gameState.sequence.forEach((command, index) => {
                const commandText = {
                    'A': '前進一格',
                    'B': '原地左轉', 
                    'C': '前進；若前方沒路就左轉', 
                    'D': '前進；若前方沒路就右轉'
                };
                
                const token = document.createElement('div');
                token.className = `sequence-token token-${command.toLowerCase()}`;
                token.innerHTML = `
                    <div>${command}</div>
                    <div style="font-size: 8px;">${commandText[command]}</div>
                    <button class="remove-btn" onclick="removeFromSequence(${index})">×</button>
                `;
                sequenceArea.appendChild(token);
            });
        }
        
        async function executeAtomicCommand(command) {
              return new Promise(resolve => {
                  setTimeout(() => {
                      if (gameState.gameEnded) {
                          resolve();
                          return;
                      }
                      
                      let shouldMove = false;
                      let shouldTurn = false;
                      let turnDirection = null; 
                      
                      const frontPos = getFrontPosition();
                      // 檢查前方是否有路（邊界內 且 非障礙物）
                      const canMoveForward = isValidPosition(frontPos.x, frontPos.y); 
                      
                      // 檢查前方是否為邊界牆 (用於指令 A 的失敗判斷)
                      const isWall = frontPos.x < 0 || frontPos.x >= MAZE_SIZE || frontPos.y < 0 || frontPos.y >= MAZE_SIZE;

                      switch (command) {
                          case 'A': // 前進一格
                              if (canMoveForward) {
                                  shouldMove = true;
                              } else if (isWall) {
                                  // 撞到邊界牆，遊戲失敗
                                  gameState.gameEnded = true;
                                  showResult(false, "撞到邊界！移動失敗！");
                              } else {
                                  // 撞到障礙物，停在原地，指令無效
                              }
                              break;
                          case 'B': // 原地左轉
                              shouldTurn = true;
                              turnDirection = 'left';
                              break;
                          // 選擇結構指令 C: 前進；若前方沒路就左轉
                          case 'C': 
                              if (canMoveForward) {
                                  shouldMove = true; // 前進
                              } else {
                                  shouldTurn = true; // 左轉
                                  turnDirection = 'left'; 
                              }
                              break;
                          // 選擇結構指令 D: 前進；若前方沒路就右轉
                          case 'D': 
                              if (canMoveForward) {
                                  shouldMove = true; // 前進
                              } else {
                                  shouldTurn = true; // 右轉
                                  turnDirection = 'right'; 
                              }
                              break;
                      }
                      
                      if (shouldMove) {
                           gameState.playerPos = frontPos;
                      }
                      
                      if (shouldTurn) {
                          if (turnDirection === 'left') {
                              // 左轉 (逆時針)
                              gameState.playerDirection = (gameState.playerDirection + 3) % 4;
                              gameState.playerRotation -= 90; 
                          } else if (turnDirection === 'right') {
                              // 右轉 (順時針)
                              gameState.playerDirection = (gameState.playerDirection + 1) % 4;
                              gameState.playerRotation += 90; 
                          }
                      }
                      
                      updatePlayerPosition();
                      
                      // 檢查是否到達寶藏
                      if (!gameState.gameEnded && gameState.playerPos.x === TREASURE_POS.x && gameState.playerPos.y === TREASURE_POS.y) {
                          gameState.gameEnded = true;
                          const config = window.elementSdk?.config || defaultConfig;
                          showResult(true, config.success_message || defaultConfig.success_message);
                      }
                      
                      resolve();
                  }, 500); // 每次原子操作延遲 500ms
              });
        }
        
        async function executeSequence() {
            if (gameState.sequence.length === 0 || gameState.isExecuting) return;
            
            gameState.isExecuting = true;
            document.getElementById('executeBtn').disabled = true;
            document.getElementById('resultMessage').textContent = '';
            document.getElementById('resultMessage').className = 'result-message';

            for (let index = 0; index < gameState.sequence.length && !gameState.gameEnded; index++) {
                const command = gameState.sequence[index];
                await executeAtomicCommand(command);
            }
            
            gameState.isExecuting = false;
            document.getElementById('executeBtn').disabled = false;
            
            if (!gameState.gameEnded) {
                showResult(false, "指令執行完畢，還沒到達寶藏，試試調整指令序列！");
            }
        }

        function showResult(success, message) {
            const resultDiv = document.getElementById('resultMessage');
            resultDiv.textContent = message;
            resultDiv.className = `result-message ${success ? 'success' : 'failure'}`;
        }

        function resetGame() {
            gameState = {
                playerPos: { x: 2, y: 3 },
                playerDirection: 3,
                playerRotation: 0, 
                sequence: [],
                isExecuting: false,
                gameEnded: false
            };
            
            initMaze(); 
            updateSequenceDisplay();
            document.getElementById('resultMessage').textContent = '';
            document.getElementById('resultMessage').className = 'result-message';
            document.getElementById('executeBtn').disabled = false;
        }

        // --- 事件監聽器與初始化 ---
        document.getElementById('executeBtn').addEventListener('click', executeSequence);
        document.getElementById('resetBtn').addEventListener('click', resetGame);

        document.addEventListener('DOMContentLoaded', () => {
            // 確保所有 DOM 元素準備好
            
            // 1. 執行初始化（繪製迷宮）
            initMaze();
            
            // 2. 重置遊戲狀態至初始設定
            resetGame();
            
            // 3. 綁定指令牌的點擊和拖曳事件 (確保元素已存在且狀態已重置)
            setupDragAndDrop();
        });
    </script>
</body>
